<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CyberTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    .accent-line {
      height: 3px;
      background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444);
      background-size: 200% 100%;
      animation: gradient-shift 4s linear infinite;
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(239, 68, 68, 0.1);
    }

    .gradient-text {
      background: linear-gradient(135deg, #f97316, #ef4444, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cyber-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .cyber-input:focus {
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.25);
      outline: none;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between items-center relative overflow-hidden">

  <!-- Background Ambient Glow -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 left-1/3 -translate-x-1/2 w-80 h-80 bg-orange-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top Accent -->
  <div class="w-full">
    <div class="accent-line"></div>
  </div>

  <!-- Main Login Card -->
  <div class="w-full max-w-md px-4 py-8 z-10">
    <div class="glass-card rounded-2xl p-8">
      
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-red-500/10 border border-red-500/20 mb-3 text-2xl">
          🔍
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight">
          <span class="gradient-text">CYBERTRACK</span>
        </h1>
        <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold">Forensic Intelligence Portal</p>
      </div>

      <!-- Error Alert -->
      {% if error %}
      <div class="mb-6 p-3.5 rounded-xl bg-red-950/60 border border-red-500/40 text-red-300 text-xs flex items-center gap-2.5">
        <span class="text-base">⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Username</label>
          <div class="relative">
            <input
              type="text"
              name="username"
              required
              autofocus
              placeholder="Admin username"
              class="cyber-input w-full px-4 py-3 rounded-xl text-sm text-gray-200 placeholder-gray-600"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5 uppercase tracking-wider">Password</label>
          <div class="relative">
            <input
              type="password"
              id="passwordField"
              name="password"
              required
              placeholder="••••••••••••"
              class="cyber-input w-full px-4 py-3 pr-10 rounded-xl text-sm text-gray-200 placeholder-gray-600"
            />
            <button
              type="button"
              onclick="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition text-sm"
              tabindex="-1"
            >
              👁️
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-bold text-sm rounded-xl transition duration-200 shadow-lg shadow-red-600/30 flex items-center justify-center gap-2"
        >
          <span>Authenticate & Access</span>
          <span>→</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="mt-8 pt-6 border-t border-gray-800/60 text-center">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-red-950/40 border border-red-800/30 text-[10px] text-red-400 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
          Restricted Area · Authorized Use Only
        </div>
        <p class="text-[11px] text-gray-600 mt-2">
          Public registration is disabled. Unauthorized access attempts are monitored and logged.
        </p>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="py-4 text-center text-xs text-gray-600 z-10">
    &copy; 2026 CyberTrack Intelligence. All rights reserved.
  </div>

  <script>
    function togglePassword() {
      const field = document.getElementById('passwordField');
      if (field.type === 'password') {
        field.type = 'text';
      } else {
        field.type = 'password';
      }
    }
  </script>
</body>
</html>

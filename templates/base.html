<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CyberTrack{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    /* Gradient accent line */
    .accent-line { height: 3px; background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444); background-size: 200% 100%; animation: gradient-shift 4s linear infinite; }
    @keyframes gradient-shift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    /* Glassmorphism card */
    .glass { background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); }
    .glass-strong { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }

    /* Badges */
    .badge-active   { background: #052e16; color: #86efac; }
    .badge-inactive { background: #1c1917; color: #78716c; }
    .badge-mobile   { background: #0c4a6e; color: #7dd3fc; }
    .badge-pc       { background: #1e1b4b; color: #a5b4fc; }
    .badge-proxy    { background: #450a0a; color: #fca5a5; }
    .badge-gps      { background: #052e16; color: #6ee7b7; }
    .badge-ip       { background: #0f172a; color: #94a3b8; }
    .badge-default  { background: #1e293b; color: #94a3b8; }
    .badge-news     { background: #1e1b4b; color: #a5b4fc; }
    .badge-download { background: #172554; color: #93c5fd; }
    .badge-verify   { background: #052e16; color: #86efac; }
    .badge-survey   { background: #422006; color: #fdba74; }
    .badge-incognito { background: #431407; color: #fb923c; }
    .badge-adblocker { background: #422006; color: #fbbf24; }
    .badge-bot      { background: #1c1917; color: #78716c; }

    /* Table hover */
    tr.clickable-row { cursor: pointer; transition: background 0.15s; }
    tr.clickable-row:hover td { background: rgba(255,255,255,0.03); }

    /* Gradient text */
    .gradient-text { background: linear-gradient(135deg, #f97316, #ef4444, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* Sidebar */
    .sidebar { width: 220px; min-height: 100vh; }
    .sidebar a { transition: all 0.2s; }
    .sidebar a:hover { background: rgba(255,255,255,0.06); }
    .sidebar a.active { background: rgba(239, 68, 68, 0.12); color: #f87171; border-right: 2px solid #ef4444; }

    /* Pulse animation */
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .pulse-soft { animation: pulse-soft 2s infinite; }

    /* Fade in */
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fade-in 0.4s ease-out; }

    /* Stat card hover */
    .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 24px rgba(0,0,0,0.3); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="sidebar glass-strong flex flex-col fixed top-0 left-0 z-40">
    <div class="accent-line"></div>
    <div class="px-5 py-5">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xl">🔍</span>
        <span class="text-red-400 font-bold tracking-wider text-sm">CYBERTRACK</span>
      </div>
      <span class="text-[10px] text-gray-600 uppercase tracking-widest">v2.1 — Secure</span>
    </div>
    <nav class="flex-1 px-3 space-y-1 mt-2">
      <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </a>
      <a href="/docs" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        API Docs
      </a>
      <a href="/logout" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-red-400/80 hover:text-red-300 hover:bg-red-950/30 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sign Out
      </a>
    </nav>
    <div class="px-5 py-4 border-t border-gray-800/50">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Admin Active</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 ml-[220px]">
    <div class="accent-line"></div>
    <main class="p-6 lg:p-8 max-w-7xl mx-auto fade-in">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
